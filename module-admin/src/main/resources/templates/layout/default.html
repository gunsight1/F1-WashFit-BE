<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$CONTENT_TITLE - WashFit Admin">WashFit Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .wrapper {
            display: flex;
            flex: 1;
        }
        .sidebar {
            min-width: 250px;
            background-color: #343a40;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 10px;
            display: block;
            border-radius: 5px;
        }
        .sidebar a:hover {
            background-color: #495057;
        }
        .content {
            flex: 1;
            padding: 20px;
            background-color: #f8f9fa;
        }
        .dark-mode {
            background-color: #212529 !important;
            color: white !important;
        }
        .dark-mode .content {
            background-color: #343a40 !important;
            color: white !important;
        }
        .dark-mode .card {
            background-color: #495057 !important;
            color: white !important;
        }
        .dark-mode table {
            color: white !important;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Sidebar -->
    <nav class="sidebar">
        <h3>WashFit Admin</h3>
        <hr>
        <a th:href="@{/admin/members}"><i class="bi bi-people"></i> 회원 관리</a>
        <a th:href="@{/admin/washzones}"><i class="bi bi-geo-alt"></i> 세차장 관리</a>
        <a th:href="@{/admin/products}"><i class="bi bi-box-seam"></i> 제품 관리</a>
        <hr>
        <div class="mt-auto">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="darkModeSwitch">
                <label class="form-check-label" for="darkModeSwitch">Dark Mode</label>
            </div>
            <form th:action="@{/logout}" method="post" class="mt-3">
                <button type="submit" class="btn btn-danger w-100">Logout</button>
            </form>
        </div>
    </nav>

    <!-- Content -->
    <div class="content">
        <div layout:fragment="content"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const darkModeSwitch = document.getElementById('darkModeSwitch');
    const body = document.body;

    // Check local storage for dark mode preference
    if (localStorage.getItem('darkMode') === 'enabled') {
        body.classList.add('dark-mode');
        darkModeSwitch.checked = true;
    }

    darkModeSwitch.addEventListener('change', () => {
        if (darkModeSwitch.checked) {
            body.classList.add('dark-mode');
            localStorage.setItem('darkMode', 'enabled');
        } else {
            body.classList.remove('dark-mode');
            localStorage.setItem('darkMode', 'disabled');
        }
    });
</script>
</body>
</html>
