<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>회원 관리</title>
</head>
<body>
<div layout:fragment="content">
    <h2>회원 관리</h2>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Gender</th>
            <th>Age</th>
            <th>Created At</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="member : ${members}">
            <td th:text="${member.id}"></td>
            <td th:text="${member.email}"></td>
            <td th:text="${member.gender}"></td>
            <td th:text="${member.age}"></td>
            <td th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>
    <!-- Pagination -->
    <nav th:if="${members.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${members.first} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/members(page=${members.number - 1})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, members.totalPages - 1)}"
                th:classappend="${members.number == i} ? 'active'">
                <a class="page-link" th:href="@{/admin/members(page=${i})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${members.last} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/members(page=${members.number + 1})}">Next</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
